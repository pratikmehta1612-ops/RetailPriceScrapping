<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retail Price Compare</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⛽</span>
      <div>
        <h1>Retail Price Compare</h1>
        <p class="sub">Automotive parts &amp; supplies, matched by spec</p>
      </div>
    </div>
    <button id="refresh-all" class="btn ghost" type="button">Refresh all prices</button>
  </header>

  <section class="add card">
    <form id="add-form" class="add-row">
      <input id="add-url" type="url" required placeholder="Paste a product link from Amazon, Walmart, Target, Best Buy or any store">
      <button class="btn primary" type="submit">Add product</button>
    </form>
    <details id="import">
      <summary>Site blocked the scraper? Import a saved page instead</summary>
      <form id="import-form" class="import-form">
        <input id="import-url" type="url" required placeholder="Original product URL">
        <label class="file">
          <input id="import-file" type="file" accept=".html,.htm">
          <span>Choose saved .html file</span>
        </label>
        <textarea id="import-html" rows="4" placeholder="…or paste the page HTML here"></textarea>
        <button class="btn" type="submit">Import page</button>
      </form>
    </details>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>

  <main class="layout">
    <section class="card list-pane">
      <div class="list-head">
        <input id="filter" type="search" placeholder="Filter products">
        <div id="chips" class="chips"></div>
      </div>
      <ul id="product-list" class="product-list"></ul>
      <p id="empty" class="empty" hidden>No products yet. Add a product link above to start comparing.</p>
    </section>

    <section id="detail" class="card detail-pane">
      <p class="empty">Select a product to see its features, price history and similar products from other stores.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
